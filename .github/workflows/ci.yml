name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: just check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: gradle/actions/setup-gradle@v4
      - uses: extractions/setup-just@v2
      - name: Install cargo-ndk
        run: cargo install --locked cargo-ndk
      - name: Install passalong-server v0.1.0 for the bridge's server tests
        # The server is AGPL-3.0-or-later; it is run by the tests, never linked.
        run: cargo install --locked --git https://github.com/joelee/passalong-server --tag v0.1.0 passalong-server
      - name: Run every check
        # The runner has the JDK and Gradle already; `mise exec` is a no-op
        # shim here so the justfile works unchanged.
        run: |
          mkdir -p "$HOME/.local/bin"
          printf '#!/bin/sh\nshift\nexec "$@"\n' > "$HOME/.local/bin/mise"
          chmod +x "$HOME/.local/bin/mise"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          just check
          PASSALONG_SERVER_BIN="$HOME/.cargo/bin/passalong-server" just test-https
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_NDK_LATEST_HOME }}
